[package]
name = "risk-oracle"
version = "0.1.0"
edition = "2021"
description = "On-chain risk classifier (fixed-point logistic regression) for Pharos Stylus/WASM."
license = "MIT"

[dependencies]
# Pharos Stylus SDK (fork of Arbitrum Stylus). Deploy with pharos-cargo-stylus.
stylus-sdk = "0.6"

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
