[package]
name = "risk-oracle"
version = "0.1.0"
edition = "2021"
description = "On-chain risk classifier (fixed-point logistic regression) for Pharos Stylus/WASM."
license = "MIT"

[dependencies]
# Stylus SDK. 0.6 has a const-eval bug (E0080) on rustc >=1.83 while its deps need
# newer rustc — a version deadlock — so we use a newer SDK that compiles on modern
# toolchains. Deploy with the Pharos fork (pharos-cargo-stylus).
stylus-sdk = "0.8"

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
