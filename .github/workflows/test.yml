name: tests

# Runs every skill's test suite on push/PR so the 132 passing tests are
# reproducible by anyone (judges included). All suites are offline — in-memory
# EVM (@ethereumjs) + mocked RPC — so no network or keys are needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - 01-agent-treasury
          - 02-agent-shield
          - 03-agent-strategy
          - 04-a2a-mesh
          - 05-stylus-compute
          - 06-x402-facilitator
    name: ${{ matrix.skill }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install
        working-directory: ${{ matrix.skill }}
        run: npm install --no-audit --no-fund
      - name: test
        working-directory: ${{ matrix.skill }}
        run: npm test
