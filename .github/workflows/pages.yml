name: pages

# Deploys the web/ folder (dashboard + interactive walkthrough) to GitHub Pages.
# Gives a public URL for the live dashboard and demo.html — no external host needed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
